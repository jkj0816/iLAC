<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가입·로그인 · ILAC</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/content.css"></head><body><header class="local-header"><a class="logo" href="/index.html"><img src="/assets/ilac-logo.png" alt="iLAC"></a><nav><a href="/index.html#countries">국가 가이드</a><a href="/content/academy/index.html">Academy</a><a href="/home/index.html">플랫폼</a></nav></header><main class="local-content"><h1>전문가에게 질문하기</h1><p>비자·교육·주거·사업 등 궁금한 내용을 정리해 보세요.</p><p class="local-note">질문을 전문가에게 등록하는 기능은 서버 연결이 필요합니다. 지금은 질문을 작성하고 복사할 수 있습니다.</p><form id="local-question"><label>질문 제목<input required name="title"></label><label>질문 내용<textarea required name="body" rows="6"></textarea></label><button class="primary">질문 내용 복사하기</button><p id="draft-status" role="status"></p></form><script>document.querySelector('#local-question').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{await navigator.clipboard.writeText(f.get('title')+'\n\n'+f.get('body'));document.querySelector('#draft-status').textContent='질문을 복사했습니다. 아직 등록되지는 않았습니다.'}catch{document.querySelector('#draft-status').textContent='입력한 질문을 직접 선택해 복사해 주세요.'}})</script></main><footer class="local-footer">iLAC · admin@goilac.com <a href="/index.html">홈으로 돌아가기</a></footer></body></html>
